name: Model-free checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'
      - name: Install CPU instruments and documentation tools
        run: uv sync --extra instruments --group docs
      - name: Check static API documentation
        run: uv run python scripts/build_docs.py --check
      - name: Exercise CPU numerical and ownership contracts
        run: uv run glass-box check
      - name: Run regression suite
        run: uv run python -m unittest discover -s tests -v
      - name: Build static documentation
        run: uv run python scripts/build_site.py --output "${RUNNER_TEMP}/glass-box-site"
      - name: Build distributions
        run: uv build
      - name: Verify installed wheels outside the checkout
        run: uv run python scripts/wheel_smoke.py dist/glass_box-0.1.0-py3-none-any.whl
      - name: Audit complete source index and distribution contents
        run: >-
          uv run python scripts/release_audit.py
          dist/glass_box-0.1.0-py3-none-any.whl
          dist/glass_box-0.1.0.tar.gz
          --expected-remote-url https://github.com/xmattwest/glass-box
